<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 518" width="600" height="518" focusable="false"><text x="24" y="42" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:31px;font-weight:700;white-space:pre">PDFs with text pages and scanned pages</text><text x="24" y="63" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">Each page takes the cheapest path that still reads it, then the pieces</text><text x="24" y="84" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">go back in order.</text><rect x="170" y="102" width="260" height="62" rx="10" style="fill:var(--surface-2,#f5f3ee);stroke:var(--border-3,#cbd5e1);stroke-width:1.5"/><text x="300" y="129.5" text-anchor="middle" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:21px;font-weight:700;white-space:pre">Mixed PDF</text><text x="300" y="149.5" text-anchor="middle" style="fill:var(--muted,#52525b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre">reports, contracts, scans</text><path d="M300 168V188H157V207" style="fill:none;stroke:var(--faint,#64748b);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/><line x1="157" y1="198" x2="157" y2="208" style="stroke:var(--faint,#64748b);stroke-width:2;stroke-linecap:round"/><path d="M153.5 200.8L157 208L160.5 200.8" style="fill:none;stroke:var(--faint,#64748b);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/><rect x="24" y="212" width="266" height="84" rx="10" style="fill:var(--bf-s1,#b45309);fill-opacity:0.12;stroke