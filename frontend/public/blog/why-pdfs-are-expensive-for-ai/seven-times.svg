<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 286" width="600" height="286" focusable="false"><text x="24" y="42" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:31px;font-weight:700;white-space:pre">Same 3 pages, seven times the tokens</text><text x="24" y="63" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">Claude PDF docs, Amazon Bedrock section: text extraction only versus</text><text x="24" y="84" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">each page also read as an image.</text><text x="24" y="117" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:600;white-space:pre">Text extraction only</text><line x1="24" y1="124" x2="24" y2="148" style="stroke:var(--border-3,#cbd5e1);stroke-width:1;stroke-linecap:round"/><path d="M24 125H79.4Q83.4 125 83.4 129V143Q83.4 147 79.4 147H24Z" style="fill:var(--bf-s1,#b45309)"><title>Text extraction only: ~1,000 tokens</title></path><text x="91.4" y="141" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;white-space:pre">~1,000 tokens</text><text x="24" y="175" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:600;white-space:pre">Text plus page images</text><text x="214.6" y="175" text-anchor="start" style="fill:var(--faint,#64748b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">7x</text><line x1="24" y1="182" x2="24" y2="206" style="stroke:var(--border-3,#cbd5e1);stroke-width:1;stroke-linecap:round"/><path d="M24 183H435.8Q439.8 183 439.8 187V201Q439.8 205 435.8 205H24Z" style="fill:var(--bf-s3,#c2558f)"><title>Text plus page images: ~7,000 tokens</title></path><text x="447.8" y="199" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;white-space:pre">~7,000 tokens</text><text x="24" y="242" text-anchor="start" style="fill:var(--faint,#64748b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;font-style:italic;white-space:pre">Per page, the text alone is 1,500 to 3,000 tokens for dense pages,</text><text x="24" y="261" text-anchor="start" style="fill:var(--faint,#64748b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;font-style:italic;white-space:pre">according to the same docs.</text></svg>
