apple-system,'Segoe UI',sans-serif;font-size:13.5px;font-style:italic;white-space:pre">Illustration, not a measurement. The PDF pages are counted as text plus a</text><text x="24" y="427" text-anchor="start" style="fill:var(--faint,#64748b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;font-style:italic;white-space:pre">page image (2,235 tokens each).</text></svg>
