<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 452" width="600" height="452" focusable="false"><text x="24" y="42" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:31px;font-weight:700;white-space:pre">How one question becomes 31,970 tokens</text><text x="24" y="63" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">Input-token equivalents for one document question. Output counted at</text><text x="24" y="84" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">5x, its price ratio to input.</text><text x="212" y="123" text-anchor="end" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">Your question</text><rect x="224" y="108" width="2" height="22" rx="3" style="fill:var(--bf-s1,#b45309)"><title>Your question: +60</title></rect><line x1="226" y1="130" x2="226" y2="148" style="stroke:var(--faint,#64748b);stroke-width:1;stroke-dasharray:3 3;stroke-linecap:round"/><text x="234" y="124" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:13.5px;font-weight:700;white-space:pre">+60</text><text x="212" y="163" text-anchor="end" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">Duplicated system prompt</text><rect x="224.5" y="148" width="17.4" height="22" rx="3" style="fill:var(--bf-s2,#6d5fd0)"><title>Duplicated system prompt: +2,000</title></rect><line x1="241.9" y1="170" x2="241.9" y2="1