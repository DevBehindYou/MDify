<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 328" width="600" height="328" focusable="false"><text x="24" y="42" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:31px;font-weight:700;white-space:pre">Anatomy of one &quot;simple&quot; question</text><text x="24" y="63" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">An example request to a document assistant. The question is the</text><text x="24" y="84" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">smallest part.</text><rect x="24" y="102" width="13" height="13" rx="3" style="fill:var(--bf-s1,#b45309)"/><text x="44" y="113.5" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;white-space:pre">Question</text><rect x="128.8" y="102" width="13" height="13" rx="3" style="fill:var(--bf-s2,#6d5fd0)"/><text x="148.8" y="113.5" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;white-space:pre">Instructions and tools</text><rect x="340" y="102" width="13" height="13" rx="3" style="fill:var(--bf-s3,#c2558f)"/><text x="360" y="113.5" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;white-space:pre">History and documents</text><text x="24" y="151" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:600;white-space:pre">As sent</text><rect x="24" y="159" width="1" height="24" rx="0" style="fill:var(--bf-s1,#b45309)"><title>As sent, question: 80</title></rect><rect x="26.8" y="159" width="85.4" height="24" rx="0" style="fill:var(--bf-s2,#6d5fd0)"><title>As sent, system prompt: 2,500</title></rect><rect x="114.2" y="159" width="39.9" height="24" rx="0" style="fill:var(--bf-s2,#6d5fd0)"><title>As sent, tool definitions: 1,200</title></rect><rect x="156.1" y="159" width="137.8" height="24" rx="0" style="fill:var(--bf-s3,#c2558f)"><title>As sent, chat history: 4,000</title></rect><path d="M295.9 159H501.6Q505.6 159 505.6 163V179Q505.6 183 501.6 183H295.9Z" style="fill:var(--bf-s3,#c2558f)"><title>As sent, raw PDF pages: 6,000</title></path><line x1="24" y1="157" x2="24" y2="185" style="stroke:var(--border-3,#cbd5e1);stroke-width:1;stroke-linecap:round"/><text x="513.6" y="177" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;white-space:pre">13,780</text><text x="24" y="213" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:600;white-space:pre">Trimmed</text><rect x="24" y="221" width="1" height="24" rx="0" style="fill:var(--bf-s1,#b45309)"><title>Trimmed, question: 80</title></rect><rect x="26.8" y="221" width="29.5" height="24" rx="0" style="fill:var(--bf-s2,#6d5fd0)"><title>Trimmed, system prompt: 900</title></rect><rect x="58.3" y="221" width="8.5" height="24" rx="0" style="fill:var(--bf-s2,#6d5fd0)"><title>Trimmed, tool definitions: 300</title></rect><rect x="68.7" y="221" width="19" height="24" rx="0" style="fill:var(--bf-s3,#c2558f)"><title>Trimmed, history summary: 600</title></rect><path d="M89.7 221H131.1Q135.1 221 135.1 225V241Q135.1 245 131.1 245H89.7Z" style="fill:var(--bf-s3,#c2558f)"><title>Trimmed, relevant sections as Markdown: 1,300</title></path><line x1="24" y1="219" x2="24" y2="247" style="stroke:var(--border-3,#cbd5e1);stroke-width:1;stroke-linecap:round"/><text x="143.1" y="239" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;white-space:pre">3,180</text><text x="24" y="284" text-anchor="start" style="fill:var(--faint,#64748b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;font-style:italic;white-space:pre">Illustrative numbers. Measure your own requests: most APIs return input</text><text x="24" y="303" text-anchor="start" style="fill:var(--faint,#64748b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;font-style:italic;white-space:pre">token counts with every response.</text></svg>
