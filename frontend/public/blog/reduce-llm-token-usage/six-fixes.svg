<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 444" width="600" height="444" focusable="false"><text x="24" y="42" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:31px;font-weight:700;white-space:pre">Six leaks, six fixes</text><rect x="24" y="60" width="269" height="112" rx="12" style="fill:var(--surface-2,#f5f3ee);stroke:var(--border-3,#cbd5e1);stroke-width:1.5"/><rect x="24" y="72" width="4" height="88" rx="2" style="fill:var(--bf-s3,#c2558f)"/><text x="42" y="96" text-anchor="start" style="fill:var(--bf-s3,#c2558f);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:32px;font-weight:700;white-space:pre">01</text><text x="91" y="89" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:700;white-space:pre">Raw PDFs</text><text x="42" y="126" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Convert to Markdown first.</text><text x="42" y="144" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Attach page images only for</text><text x="42" y="162" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">charts.</text><rect x="307" y="60" width="269" height="112" rx="12" style="fill:var(--surface-2,#f5f3ee);stroke:var(--border-3,#cbd5e1);stroke-width:1.5"/><rect x="307" y="72" width="4" height="88" rx="2" style="fill:var(--bf-s3,#c2558f)"/><text x="325" y="96" text-anchor="start" style="fill:var(--bf-s3,#c2558f);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:32px;font-weight:700;white-space:pre">02</text><text x="374" y="89" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:700;white-space:pre">Long chat history</text><text x="325" y="126" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Start fresh threads. Carry over</text><text x="325" y="144" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">a short summary.</text><rect x="24" y="186" width="269" height="112" rx="12" style="fill:var(--surface-2,#f5f3ee);stroke:var(--border-3,#cbd5e1);stroke-width:1.5"/><rect x="24" y="198" width="4" height="88" rx="2" style="fill:var(--bf-s2,#6d5fd0)"/><text x="42" y="222" text-anchor="start" style="fill:var(--bf-s2,#6d5fd0);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:32px;font-weight:700;white-space:pre">03</text><text x="91" y="215" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:700;white-space:pre">Oversized prompts</text><text x="42" y="252" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Cut rules the model already</text><text x="42" y="270" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">follows. Cache the rest.</text><rect x="307" y="186" width="269" height="112" rx="12" style="fill:var(--surface-2,#f5f3ee);stroke:var(--border-3,#cbd5e1);stroke-width:1.5"/><rect x="307" y="198" width="4" height="88" rx="2" style="fill:var(--bf-s2,#6d5fd0)"/><text x="325" y="222" text-anchor="start" style="fill:var(--bf-s2,#6d5fd0);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:32px;font-weight:700;white-space:pre">04</text><text x="374" y="215" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:700;white-space:pre">Unused tools</text><text x="325" y="252" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Send only the tools this request</text><text x="325" y="270" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">can use.</text><rect x="24" y="312" width="269" height="112" rx="12" style="fill:var(--surface-2,#f5f3ee);stroke:var(--border-3,#cbd5e1);stroke-width:1.5"/><rect x="24" y="324" width="4" height="88" rx="2" style="fill:var(--bf-s3,#c2558f)"/><text x="42" y="348" text-anchor="start" style="fill:var(--bf-s3,#c2558f);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:32px;font-weight:700;white-space:pre">05</text><text x="91" y="341" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:700;white-space:pre">Duplicate text</text><text x="42" y="378" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Strip repeated headers, footers</text><text x="42" y="396" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">and boilerplate.</text><rect x="307" y="312" width="269" height="112" rx="12" style="fill:var(--surface-2,#f5f3ee);stroke:var(--border-3,#cbd5e1);stroke-width:1.5"/><rect x="307" y="324" width="4" height="88" rx="2" style="fill:var(--bf-s3,#c2558f)"/><text x="325" y="348" text-anchor="start" style="fill:var(--bf-s3,#c2558f);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:32px;font-weight:700;white-space:pre">06</text><text x="374" y="341" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:700;white-space:pre">Whole documents</text><text x="325" y="378" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Retrieve the sections that</text><text x="325" y="396" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">answer the question.</text></svg>
