<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 402" width="600" height="402" focusable="false"><text x="24" y="42" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:31px;font-weight:700;white-space:pre">Every turn resends the whole chat</text><text x="24" y="63" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">Input tokens per turn in a 10-turn chat: 1,000-token system prompt,</text><text x="24" y="84" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">150-token questions, 350-token answers.</text><text x="24" y="117" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:600;white-space:pre">Turn 1</text><line x1="24" y1="124" x2="24" y2="148" style="stroke:var(--border-3,#cbd5e1);stroke-width:1;stroke-linecap:round"/><path d="M24 125H119.9Q123.9 125 123.9 129V143Q123.9 147 119.9 147H24Z" style="fill:var(--bf-s2,#6d5fd0)"><title>Turn 1: 1,150</title></path><text x="131.9" y="141" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;white-space:pre">1,150</text><text x="24" y="175" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:600;white-space:pre">Turn 4</text><line x1="24" y1="182" x2="24" y2="206" style="stroke:var(--border-3,#cbd5e1);stroke-width:1;stroke-linecap:round"/><path d="M24 183H250.3Q254.3 183 254.3 187V201Q254.3 205 250.3 