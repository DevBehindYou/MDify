ick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:32px;font-weight:700;white-space:pre">5x</text><text x="91" y="367" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:700;white-space:pre">Cap the output</text><text x="42" y="404" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Output tokens cost five times</text><text x="42" y="422" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">input.</text><rect x="307" y="338" width="269" height="104" rx="12" style="fill:var(--surface-2,#f5f3ee);stroke:var(--border-3,#cbd5e1);stroke-width:1.5"/><rect x="307" y="350" width="4" height="80" rx="2" style="fill:var(--bf-s2,#6d5fd0)"/><text x="325" y="374" text-anchor="start" style="fill:var(--bf-s2,#6d5fd0);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:32px;font-weight:700;white-space:pre">2-5x</text><text x="407" y="367" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:700;white-space:pre">Compress prompts</text><text x="325" y="404" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Learned compression on long</text><text x="325" y="422" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">inputs.</text></svg>
