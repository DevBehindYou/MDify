<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 489" width="600" height="489" focusable="false"><text x="24" y="42" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:31px;font-weight:700;white-space:pre">Markdown or the PDF itself?</text><text x="24" y="63" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">Convert by default. Send the page when the answer lives in a picture.</text><rect x="175" y="81" width="250" height="56" rx="10" style="fill:var(--surface-2,#f5f3ee);stroke:var(--border-3,#cbd5e1);stroke-width:1.5"/><text x="300" y="106" text-anchor="middle" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:21px;font-weight:700;white-space:pre">Your document</text><text x="300" y="125" text-anchor="middle" style="fill:var(--muted,#52525b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre">PDF, slides, scan</text><line x1="300" y1="141" x2="300" y2="163" style="stroke:var(--faint,#64748b);stroke-width:2;stroke-linecap:round"/><path d="M296.5 155.8L300 163L303.5 155.8" style="fill:none;stroke:var(--faint,#64748b);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/><path d="M300 167L510 209L300 251L90 209Z" style="fill:var(--surface-2,#f5f3ee);stroke:var(--text,#18181b);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round"/><text x="300" y="205" text-anchor="middle" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:20px;font-weight:700;white-space:pre">Is the answer in a chart,</text><text x="300" y="227" text-anchor="middle" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:20px;font-weight:700;white-space:pre">photo or layout?</text><path d="M90 209H149V282" style="fill:none;stroke:var(--faint,#64748b);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/><line x1="149" y1="273" x2="149" y2="283" style="stroke:var(--faint,#64748b);stroke-width:2;stroke-linecap:round"/><path d="M145.5 275.8L149 283L152.5 275.8" style="fill:none;stroke:var(--faint,#64748b);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/><path d="M510 209H451V282" style="fill:none;stroke:var(--faint,#64748b);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/><line x1="451" y1="273" x2="451" y2="283" style="stroke:var(--faint,#64748b);stroke-width:2;stroke-linecap:round"/><path d="M447.5 275.8L451 283L454.5 275.8" style="fill:none;stroke:var(--faint,#64748b);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/><text x="32" y="201" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:13px;font-weight:700;white-space:pre">YES</text><text x="568" y="201" text-anchor="end" style="fill:var(--muted,#52525b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:13px;font-weight:700;white-space:pre">NO</text><rect x="24" y="287" width="250" height="76" rx="10" style="fill:var(--bf-s2,#6d5fd0);fill-opacity:0.12;stroke:var(--bf-s2,#6d5fd0);stroke-width:2"/><text x="149" y="322" text-anchor="middle" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:21px;font-weight:700;white-space:pre">Send that page</text><text x="149" y="341" text-anchor="middle" style="fill:var(--muted,#52525b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre">image tokens are worth it here</text><rect x="326" y="287" width="250" height="76" rx="10" style="fill:var(--bf-s1,#b45309);fill-opacity:0.12;stroke:var(--bf-s1,#b45309);stroke-width:2"/><text x="451" y="322" text-anchor="middle" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:21px;font-weight:700;white-space:pre">Convert to Markdown</text><text x="451" y="341" text-anchor="middle" style="fill:var(--muted,#52525b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre">headings, lists, tables</text><line x1="451" y1="367" x2="451" y2="389" style="stroke:var(--faint,#64748b);stroke-width:2;stroke-linecap:round"/><path d="M447.5 381.8L451 389L454.5 381.8" style="fill:none;stroke:var(--faint,#64748b);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/><rect x="326" y="393" width="250" height="76" rx="10" style="fill:var(--bf-s1,#b45309);fill-opacity:0.12;stroke:var(--bf-s1,#b45309);stroke-width:2"/><text x="451" y="428" text-anchor="middle" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:21px;font-weight:700;white-space:pre">Paste only what you need</text><text x="451" y="447" text-anchor="middle" style="fill:var(--muted,#52525b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px;white-space:pre">fewer tokens per question</text></svg>
