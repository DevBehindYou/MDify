<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 390" width="600" height="390" focusable="false"><text x="24" y="42" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:31px;font-weight:700;white-space:pre">One 500-word page, three ways</text><text x="24" y="63" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">Input tokens when an AI app reads the page. PDF readers often send the</text><text x="24" y="84" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">extracted text plus an image of every page.</text><rect x="24" y="102" width="13" height="13" rx="3" style="fill:var(--bf-s1,#b45309)"/><text x="44" y="113.5" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;white-space:pre">Page text</text><rect x="136.4" y="102" width="13" height="13" rx="3" style="fill:var(--bf-s2,#6d5fd0)"/><text x="156.4" y="113.5" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;white-space:pre">Page image</text><text x="24" y="151" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:600;white-space:pre">Markdown</text><path d="M24 159H102Q106 159 106 163V179Q106 183 102 183H24Z" style="fill:var(--bf-s1,#b45309)"><title>Markdown, text: 667</title></path><line x1="24" y1="157" x2="24" y2="185" style="stroke:var(--border-3,#cbd5e1);stroke-width:1;stroke-linecap:round"/><text x="114" y="177" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;white-space:pre">667</text><text x="24" y="213" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:600;white-space:pre">PDF, standard image</text><rect x="24" y="221" width="80" height="24" rx="0" style="fill:var(--bf-s1,#b45309)"><title>PDF, standard image, text: 667</title></rect><path d="M106 221H294.9Q298.9 221 298.9 225V241Q298.9 245 294.9 245H106Z" style="fill:var(--bf-s2,#6d5fd0)"><title>PDF, standard image, image: 1,568</title></path><line x1="24" y1="219" x2="24" y2="247" style="stroke:var(--border-3,#cbd5e1);stroke-width:1;stroke-linecap:round"/><text x="306.9" y="239" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;white-space:pre">2,235  (-70%)</text><text x="24" y="275" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:600;white-space:pre">PDF, high-res image</text><rect x="24" y="283" width="80" height="24" rx="0" style="fill:var(--bf-s1,#b45309)"><title>PDF, high-res image, text: 667</title></rect><path d="M106 283H435.8Q439.8 283 439.8 287V303Q439.8 307 435.8 307H106Z" style="fill:var(--bf-s2,#6d5fd0)"><title>PDF, high-res image, image: 2,714</title></path><line x1="24" y1="281" x2="24" y2="309" style="stroke:var(--border-3,#cbd5e1);stroke-width:1;stroke-linecap:round"/><text x="447.8" y="301" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;white-space:pre">3,381  (-80%)</text><text x="24" y="346" text-anchor="start" style="fill:var(--faint,#64748b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;font-style:italic;white-space:pre">Text: 100 tokens is about 75 words. Image: one token per 28 x 28 px patch</text><text x="24" y="365" text-anchor="start" style="fill:var(--faint,#64748b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;font-style:italic;white-space:pre">of a 1275 x 1650 px page, capped at 1,568 on standard models.</text></svg>
