xt,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:700;white-space:pre">Overlap</text><text x="325" y="126" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Keep it low. 50% doubles</text><text x="325" y="144" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">storage.</text><rect x="24" y="170" width="269" height="96" rx="12" style="fill:var(--surface-2,#f5f3ee);stroke:var(--border-3,#cbd5e1);stroke-width:1.5"/><rect x="24" y="182" width="4" height="72" rx="2" style="fill:var(--bf-s3,#c2558f)"/><text x="42" y="206" text-anchor="start" style="fill:var(--bf-s3,#c2558f);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:32px;font-weight:700;white-space:pre">03</text><text x="91" y="199" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:700;white-space:pre">Top-K</text><text x="42" y="236" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Retrieve wide, send narrow.</text><rect x="307" y="170" width="269" height="96" rx="12" style="fill:var(--surface-2,#f5f3ee);stroke:var(--border-3,#cbd5e1);stroke-width:1.5"/><rect x="307" y="182" width="4" height="72" rx="2" style="fill:var(--bf-s2,#6d5fd0)"/><text x="325" y="206" text-anchor="start" style="fill:var(--bf-s2,#6d5fd0);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:32px;font-weight:700;white-space:pre">04</text><text x="374" y="199" te