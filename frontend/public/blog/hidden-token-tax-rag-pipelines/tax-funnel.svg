<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 414" width="600" height="414" focusable="false"><text x="24" y="42" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:31px;font-weight:700;white-space:pre">Where 8,000 tokens of context come from</text><text x="24" y="63" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">One question, one untuned pipeline. The model needed about 1,500</text><text x="24" y="84" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">tokens to answer.</text><rect x="24" y="102" width="552" height="44" rx="8" style="fill:var(--bf-s3,#c2558f);fill-opacity:0.16;stroke:var(--bf-s3,#c2558f);stroke-width:1.8"><title>Retrieve top 20: 20 chunks x 400 = 8,000 tokens</title></rect><text x="300" y="122" text-anchor="middle" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:600;white-space:pre">Retrieve top 20</text><text x="300" y="139" text-anchor="middle" style="fill:var(--muted,#52525b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:13.5px;white-space:pre">20 chunks x 400 = 8,000 tokens</text><line x1="300" y1="149" x2="300" y2="163" style="stroke:var(--faint,#64748b);stroke-width:1.8;stroke-linecap:round"/><path d="M297.4 157.6L300 163L302.6 157.6" style="fill:none;stroke:var(--faint,#64748b);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round"/><rect x="93" y="166" width="414" height="44" rx="8" style="fill:var(--bf-s3,#c2558f);fill-opacity:0.16;stroke:var(--bf-s3,#c2558f);stroke-width:1.8"><title>Drop near-duplicates: 15 chunks, ~6,000 tokens</title></rect><text x="300" y="186" text-anchor="middle" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:600;white-space:pre">Drop near-duplicates</text><text x="300" y="203" text-anchor="middle" style="fill:var(--muted,#52525b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:13.5px;white-space:pre">15 chunks, ~6,000 tokens</text><line x1="300" y1="213" x2="300" y2="227" style="stroke:var(--faint,#64748b);stroke-width:1.8;stroke-linecap:round"/><path d="M297.4 221.6L300 227L302.6 221.6" style="fill:none;stroke:var(--faint,#64748b);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round"/><rect x="202.8" y="230" width="194.4" height="44" rx="8" style="fill:var(--bf-s2,#6d5fd0);fill-opacity:0.16;stroke:var(--bf-s2,#6d5fd0);stroke-width:1.8"><title>Rerank, keep top 6: ~2,400 tokens</title></rect><text x="300" y="250" text-anchor="middle" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:600;white-space:pre">Rerank, keep top 6</text><text x="300" y="267" text-anchor="middle" style="fill:var(--muted,#52525b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:13.5px;white-space:pre">~2,400 tokens</text><line x1="300" y1="277" x2="300" y2="291" style="stroke:var(--faint,#64748b);stroke-width:1.8;stroke-linecap:round"/><path d="M297.4 285.6L300 291L302.6 285.6" style="fill:none;stroke:var(--faint,#64748b);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round"/><rect x="185.2" y="294" width="229.6" height="44" rx="8" style="fill:var(--bf-s1,#b45309);fill-opacity:0.16;stroke:var(--bf-s1,#b45309);stroke-width:1.8"><title>Keep relevant passages: ~1,500 tokens needed</title></rect><text x="300" y="314" text-anchor="middle" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:600;white-space:pre">Keep relevant passages</text><text x="300" y="331" text-anchor="middle" style="fill:var(--muted,#52525b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:13.5px;white-space:pre">~1,500 tokens needed</text><text x="24" y="370" text-anchor="start" style="fill:var(--faint,#64748b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;font-style:italic;white-space:pre">Illustrative pipeline. Each step needs its own recall test before you</text><text x="24" y="389" text-anchor="start" style="fill:var(--faint,#64748b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;font-style:italic;white-space:pre">trust the cut.</text></svg>
