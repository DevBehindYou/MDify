<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 402" width="600" height="402" focusable="false"><text x="24" y="42" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:31px;font-weight:700;white-space:pre">What chunk overlap costs</text><text x="24" y="63" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">Tokens stored and embedded per token of source text, by overlap</text><text x="24" y="84" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">between neighbouring chunks.</text><text x="24" y="117" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:600;white-space:pre">0% overlap</text><line x1="24" y1="124" x2="24" y2="148" style="stroke:var(--border-3,#cbd5e1);stroke-width:1;stroke-linecap:round"/><path d="M24 125H265.5Q269.5 125 269.5 129V143Q269.5 147 265.5 147H24Z" style="fill:var(--bf-s1,#b45309)"><title>0% overlap: 1.00x</title></path><text x="277.5" y="141" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;white-space:pre">1.00x</text><text x="24" y="175" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:600;white-space:pre">10% overlap</text><line x1="24" y1="182" x2="24" y2="206" style="stroke:var(--border-3,#cbd5e1);stroke-width:1;stroke-linecap:round"/><path d="M24 183H292.5Q296.5 183 296.5 187V201Q296.5 205 292.5 205H24Z" style="fill:var(--bf-s2,#6d5fd0)"><title>10% overlap: 1.11x</title></path><text x="304.5" y="199" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;white-space:pre">1.11x</text><text x="24" y="233" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:600;white-space:pre">25% overlap</text><line x1="24" y1="240" x2="24" y2="264" style="stroke:var(--border-3,#cbd5e1);stroke-width:1;stroke-linecap:round"/><path d="M24 241H346.5Q350.5 241 350.5 245V259Q350.5 263 346.5 263H24Z" style="fill:var(--bf-s2,#6d5fd0)"><title>25% overlap: 1.33x</title></path><text x="358.5" y="257" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;white-space:pre">1.33x</text><text x="24" y="291" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:600;white-space:pre">50% overlap</text><line x1="24" y1="298" x2="24" y2="322" style="stroke:var(--border-3,#cbd5e1);stroke-width:1;stroke-linecap:round"/><path d="M24 299H511Q515 299 515 303V317Q515 321 511 321H24Z" style="fill:var(--bf-s3,#c2558f)"><title>50% overlap: 2.00x</title></path><text x="523" y="315" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;white-space:pre">2.00x</text><text x="24" y="358" text-anchor="start" style="fill:var(--faint,#64748b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;font-style:italic;white-space:pre">Overlap also lets two neighbouring chunks carry the same sentences into</text><text x="24" y="377" text-anchor="start" style="fill:var(--faint,#64748b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;font-style:italic;white-space:pre">one prompt.</text></svg>
