<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 429" width="600" height="429" focusable="false"><text x="24" y="42" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:31px;font-weight:700;white-space:pre">Where optimization pays</text><text x="24" y="63" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">Ranked by how often the cost repeats.</text><rect x="24" y="81" width="269" height="100" rx="12" style="fill:var(--surface-2,#f5f3ee);stroke:var(--border-3,#cbd5e1);stroke-width:1.5"/><rect x="24" y="93" width="4" height="76" rx="2" style="fill:var(--bf-s3,#c2558f)"/><text x="42" y="117" text-anchor="start" style="fill:var(--bf-s3,#c2558f);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:32px;font-weight:700;white-space:pre">01</text><text x="91" y="110" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:700;white-space:pre">Context size</text><text x="42" y="147" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Billed on every question. Set a</text><text x="42" y="165" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">hard token budget.</text><rect x="307" y="81" width="269" height="100" rx="12" style="fill:var(--surface-2,#f5f3ee);stroke:var(--border-3,#cbd5e1);stroke-width:1.5"/><rect x="307" y="93" width="4" height="76" rx="2" style="fill:var(--bf-s3,#c2558f)"/><text x="325" y="117" text-anchor="start" style="fill:var(--bf-s3,#c2558f);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:32px;font-weight:700;white-space:pre">02</text><text x="374" y="110" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:700;white-space:pre">Top-K</text><text x="325" y="147" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Retrieve wide, send narrow.</text><rect x="24" y="195" width="269" height="100" rx="12" style="fill:var(--surface-2,#f5f3ee);stroke:var(--border-3,#cbd5e1);stroke-width:1.5"/><rect x="24" y="207" width="4" height="76" rx="2" style="fill:var(--bf-s2,#6d5fd0)"/><text x="42" y="231" text-anchor="start" style="fill:var(--bf-s2,#6d5fd0);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:32px;font-weight:700;white-space:pre">03</text><text x="91" y="224" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:700;white-space:pre">Reranking</text><text x="42" y="261" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Costs a call, saves context</text><text x="42" y="279" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">tokens.</text><rect x="307" y="195" width="269" height="100" rx="12" style="fill:var(--surface-2,#f5f3ee);stroke:var(--border-3,#cbd5e1);stroke-width:1.5"/><rect x="307" y="207" width="4" height="76" rx="2" style="fill:var(--bf-s2,#6d5fd0)"/><text x="325" y="231" text-anchor="start" style="fill:var(--bf-s2,#6d5fd0);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:32px;font-weight:700;white-space:pre">04</text><text x="374" y="224" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:700;white-space:pre">Parse quality</text><text x="325" y="261" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Clean Markdown means fewer junk</text><text x="325" y="279" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">chunks.</text><rect x="24" y="309" width="269" height="100" rx="12" style="fill:var(--surface-2,#f5f3ee);stroke:var(--border-3,#cbd5e1);stroke-width:1.5"/><rect x="24" y="321" width="4" height="76" rx="2" style="fill:var(--bf-s1,#b45309)"/><text x="42" y="345" text-anchor="start" style="fill:var(--bf-s1,#b45309);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:32px;font-weight:700;white-space:pre">05</text><text x="91" y="338" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:700;white-space:pre">Caching</text><text x="42" y="375" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Cache the stable prompt prefix.</text><rect x="307" y="309" width="269" height="100" rx="12" style="fill:var(--surface-2,#f5f3ee);stroke:var(--border-3,#cbd5e1);stroke-width:1.5"/><rect x="307" y="321" width="4" height="76" rx="2" style="fill:var(--bf-s1,#b45309)"/><text x="325" y="345" text-anchor="start" style="fill:var(--bf-s1,#b45309);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:32px;font-weight:700;white-space:pre">06</text><text x="374" y="338" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:700;white-space:pre">Skip RAG</text><text x="325" y="375" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">Under ~200,000 tokens, send it</text><text x="325" y="393" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">all.</text></svg>
