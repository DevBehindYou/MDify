<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 286" width="600" height="286" focusable="false"><text x="24" y="42" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-patrick-hand,'Patrick Hand'),'Patrick Hand',ui-rounded,system-ui,sans-serif;font-size:31px;font-weight:700;white-space:pre">One-time tokens vs monthly tokens</text><text x="24" y="63" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">A 2,000-page corpus answering 10,000 questions a month with 8,000</text><text x="24" y="84" text-anchor="start" style="fill:var(--muted,#52525b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14.5px;white-space:pre">tokens of context each.</text><text x="24" y="117" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:600;white-space:pre">Embed the whole corpus, once</text><line x1="24" y1="124" x2="24" y2="148" style="stroke:var(--border-3,#cbd5e1);stroke-width:1;stroke-linecap:round"/><path d="M24 125H27.5Q31.1 125 31.1 128.5V143.5Q31.1 147 27.5 147H24Z" style="fill:var(--bf-s2,#6d5fd0)"><title>Embed the whole corpus, once: 1.33M tokens</title></path><text x="39.1" y="141" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;white-space:pre">1.33M tokens</text><text x="24" y="175" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:600;white-space:pre">Context sent to the model, per month</text><text x="343.6" y="175" text-anchor="start" style="fill:var(--faint,#64748b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;white-space:pre">60x</text><line x1="24" y1="182" x2="24" y2="206" style="stroke:var(--border-3,#cbd5e1);stroke-width:1;stroke-linecap:round"/><path d="M24 183H445.2Q449.2 183 449.2 187V201Q449.2 205 445.2 205H24Z" style="fill:var(--bf-s3,#c2558f)"><title>Context sent to the model, per month: 80M tokens</title></path><text x="457.2" y="199" text-anchor="start" style="fill:var(--text,#18181b);font-family:var(--font-jetbrains-mono,'JetBrains Mono'),'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:15px;font-weight:700;white-space:pre">80M tokens</text><text x="24" y="242" text-anchor="start" style="fill:var(--faint,#64748b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;font-style:italic;white-space:pre">About 667 tokens per page as Markdown. 80M input tokens at $2 per million</text><text x="24" y="261" text-anchor="start" style="fill:var(--faint,#64748b);font-family:var(--font-inter,'Inter'),Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13.5px;font-style:italic;white-space:pre">is $160 a month, before output.</text></svg>
