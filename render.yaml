# render.yaml — MDify Pro BACKEND deploy blueprint (Render).
#
# MDify Pro is deployed as two INDEPENDENT services:
#   • Backend  (this file)          → Render
#   • Frontend (Next.js, /frontend) → Vercel  (set Root Directory = frontend)
#
# The frontend is intentionally NOT defined here — it lives on Vercel with its
# own env vars and build config, per the MDify Pro architecture.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: mdify-pro-api
    runtime: python
    rootDir: backend
    plan: free                       # upgrade to Starter ($7/mo) to remove cold starts
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health   # Render pings this to confirm the service is live
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # Comma-separated allowed CORS origins. Set to the deployed Vercel URL
      # after the frontend's first deploy, e.g. https://mdify-pro.vercel.app
      - key: FRONTEND_URL
        value: ""

# ── Cold starts (free tier) ───────────────────────────────────────────────────
# The free plan spins the service down when idle (~15 min) and takes 20–60s to
# wake. The frontend handles this honestly (wake ping + status + countdown).
# To keep it warm during active hours, point an external uptime pinger at:
#   https://mdify-pro-api.onrender.com/api/v1/ready
# (a near-zero-cost liveness endpoint that does no import work).
